name: review-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: scripts/install-tools.sh
      - name: 1. Build and test
        run: ./mvnw -B verify
      - name: 2. Compare the API
        if: ${{ !cancelled() }}
        run: scripts/api-diff.sh
      - name: 3. Scan dependencies
        if: ${{ !cancelled() }}
        run: scripts/scan.sh
      - name: 4. Test the container
        if: ${{ !cancelled() }}
        run: scripts/smoke-test.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: sbom, path: target/bom.json }
