services:
  books:
    build: .
    image: books:local
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # The runtime image has no curl, so bash opens the connection itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
